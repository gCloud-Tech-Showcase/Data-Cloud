name: Publish Video Search UI

on:
  push:
    branches: [main]
    paths: [ui/video-search/**]

jobs:
  publish:
    # Only runs on the upstream repo, not forks
    if: github.repository == 'gCloud-Tech-Showcase/Data-Cloud'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ui/video-search
          push: true
          tags: |
            ghcr.io/gcloud-tech-showcase/video-search-ui:latest
            ghcr.io/gcloud-tech-showcase/video-search-ui:${{ github.sha }}
